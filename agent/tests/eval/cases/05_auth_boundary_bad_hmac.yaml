name: auth_boundary_bad_hmac
description: |
  Sending a request with an invalid HMAC must result in a refusal, not a
  successful agent response. This is the integrity-check boundary — the
  agent should never run tools or call the LLM for an unsigned/forged
  request.

  This case is the auth-boundary case from the brief's interview prep:
  "What does your eval suite test that a happy-path demo would not reveal?"

patient_id: 1
user_id: 1
bad_hmac: true
messages:
  - role: user
    content: "Generate a pre-visit brief for this patient."

expected:
  status: refused
  expect_refusal_reason_contains: "integrity"
