name: evidence_retrieval_statin_ldl_target
endpoint: /graph_chat
category: evidence_retrieval
description: |
  Evidence retrieval for statin therapy LDL target guidelines (ACC/AHA). The
  agent must return at least one guideline citation and mention LDL in the
  response. Tests retrieval for a lipid management query — relevant to case 33
  (lipid panel extraction showing LDL = 145 mg/dL abnormal). The retriever
  should find cardiovascular risk reduction guidelines covering LDL targets.
patient_id: 1
user_id: 1
live_llm_required: true
fixture_data_required: true
tier: nightly
difficulty: intermediate
failure_mode: guideline_citation_missing
rubric: [citation_present, factually_consistent]
messages:
  - role: user
    content: "What LDL target should I aim for with statin therapy in this patient?"

expected:
  status: ok
  min_guideline_citations: 1
  must_mention:
    - "LDL"
