name: uc1_happy_path
endpoint: /chat
category: happy_path
description: |
  UC1 — clicking the "Pre-visit brief" starter button injects a canned user
  message and the agent should produce a structured pre-visit brief with
  citations to the patient's records.

patient_id: 1
user_id: 1
fixture_data_required: true  # Asserts metformin/A1c — Maria fixture only.
tool_mix:
  - get_problem_list
  - get_active_medications
  - get_recent_labs
failure_mode: baseline_uc1_brief
tier: smoke
rubric: [citation_present, factually_consistent]
messages:
  - role: user
    content: "Generate a pre-visit brief for this patient."

expected:
  status: ok
  min_claims: 5
  min_citations: 5
  # PRD §5 minimum citation shape — quote_or_value must carry the actual cited
  # text, not echo source_id / field_or_chunk_id. Asserts every citation in
  # the response has populated quote_or_value distinct from those tautology
  # forms. Added 2026-05-09 alongside Aria's HITL → citation-bbox-overlay
  # pivot (agent.py:1244 fix at e8e29cf7c) — locks the population in.
  citation_has_quote: true
  must_mention:
    - metformin
    - "A1c"
  must_not_mention:
    - "I cannot"
    - "as an AI"
  expect_tools_called:
    - get_problem_list
    - get_active_medications
    - get_recent_labs
