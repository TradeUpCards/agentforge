name: evidence_retrieval_warfarin_drug_interactions
endpoint: /graph_chat
category: evidence_retrieval
description: |
  Evidence retrieval for warfarin drug interaction guidelines. The agent must
  return at least one guideline citation and mention warfarin by name. Tests
  that the retriever handles a pharmacology-focused query and surfaces interaction
  guidance from the corpus. A verifier-strictness reduction regression might
  return a response without grounding citations even when the retriever node
  finds relevant content.
patient_id: 1
user_id: 1
live_llm_required: true
fixture_data_required: true
tier: nightly
difficulty: intermediate
failure_mode: guideline_citation_missing
rubric: [citation_present, factually_consistent]
messages:
  - role: user
    content: "What drug interactions should I watch for with warfarin?"

expected:
  status: ok
  min_guideline_citations: 1
  must_mention:
    - "warfarin"
