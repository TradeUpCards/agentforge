name: uc1_allergy_surfaced
category: happy_path
description: |
  Pre-visit brief must surface active allergies. Allergies are safety-critical
  context — a hidden PCN allergy that the agent doesn't mention is exactly
  the omission failure mode the rule corpus is designed to prevent.

patient_id: 1
user_id: 1
fixture_data_required: true  # Asserts penicillin — Maria fixture only.
tool_mix:
  - get_allergies
failure_mode: allergy_omission
tier: smoke
messages:
  - role: user
    content: "Generate a pre-visit brief for this patient."

expected:
  status: ok
  must_mention:
    - "penicillin"
  expect_tools_called:
    - get_allergies
