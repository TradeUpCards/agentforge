name: uc1_a1c_value_cited
endpoint: /chat
category: happy_path
description: |
  The recent A1c value must appear in the brief AND be cited to the matching
  procedure_result record. Tests both data surfacing AND citation correctness.
  Strict numeric verification is the verifier's load-bearing job — this case
  asserts the verifier didn't strip the (correct) lab claim.

patient_id: 1
user_id: 1
fixture_data_required: true  # Asserts A1c 7.8 — Maria fixture only.
difficulty: intermediate
tool_mix:
  - get_recent_labs
failure_mode: lab_value_citation
tier: smoke
rubric: [citation_present, factually_consistent]
messages:
  - role: user
    content: "Generate a pre-visit brief for this patient."

expected:
  status: ok
  must_mention:
    - "7.8"
  min_citations: 5
  # PRD §5 — populated quote_or_value distinct from source_id / field_or_chunk_id.
  # Particularly meaningful here: the A1c lab citation should carry the
  # actual "HbA1c 7.8 %" value (post-Aria-pivot agent.py:1244 / Bram's
  # evidence_retriever fix), not echo "procedure_result:5421".
  # Added 2026-05-09.
  citation_has_quote: true
  expect_tools_called:
    - get_recent_labs
