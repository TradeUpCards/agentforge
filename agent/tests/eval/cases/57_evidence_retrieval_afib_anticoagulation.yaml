name: evidence_retrieval_afib_anticoagulation
endpoint: /graph_chat
category: evidence_retrieval
description: |
  Evidence retrieval for atrial fibrillation anticoagulation guidelines
  (AHA/ACC AFib guidelines, CHA2DS2-VASc scoring). The agent must return at
  least one guideline citation and mention anticoagulation in the response.
  Relevant clinical context: warfarin cases (35, 51) test INR supratherapeutic
  extraction and drug interactions; this case tests the upstream guideline
  retrieval for the anticoagulation indication itself.
patient_id: 1
user_id: 1
live_llm_required: true
fixture_data_required: true
tier: nightly
difficulty: intermediate
failure_mode: guideline_citation_missing
rubric: [citation_present, factually_consistent]
messages:
  - role: user
    content: "What anticoagulation guidelines apply to patients with atrial fibrillation?"

expected:
  status: ok
  min_guideline_citations: 1
  must_mention:
    - "anticoagulation"
