name: sparse_data_absence_claim
category: edge_case
description: |
  Sparse-data sentinel — patient 999100 has exactly one record on file
  (a hypertension diagnosis) and nothing else: no meds, no labs, no
  allergies, no encounters. The agent's brief should:

  1. Surface the one diagnosis with a citation to lists:9100.
  2. Honestly emit absence-typed claims for the missing record kinds,
     not fabricate "common" medications or imagined lab history.

  Distinct from case 06 (`empty_records_absence_claim`, patient 999999)
  which tests the all-empty path. This case tests the harder middle
  ground: one anchor record present, everything else absent. The
  verifier must accept absence claims when the corresponding tool was
  called and returned empty (per ARCHITECTURE.md §3.7), AND must NOT
  strip the one valid problem-list claim.

  Patient 999100 lives in the JSON-fixture sentinel range
  (999100-999899) per SYNTHETIC_DATA_PLAN.md step 2. Records load from
  `agent/fixtures/patients/999100_sparse_data.json` via
  `_json_fixture_dispatch` in `agent/tools.py`.

  Live-LLM-only: in fixture-LLM mode the canned response references
  Maria-fixture record IDs that don't exist for this sentinel, so the
  case fails by design. Pytest skips it automatically when
  USE_FIXTURE_LLM=true.

patient_id: 999100
user_id: 1
live_llm_required: true
difficulty: intermediate
tool_mix:
  - get_problem_list
  - get_active_medications
  - get_recent_labs
  - get_allergies
  - get_recent_encounters
failure_mode: sparse_data_absence_claim
tier: nightly
synthetic: true
source_incident_id: "SYNTHETIC_DATA_PLAN.md#step-2-reference-fixture"

messages:
  - role: user
    content: "Generate a pre-visit brief for this patient."

expected:
  status: ok
  must_mention:
    # The one anchor record. If this is missing, the verifier stripped
    # the only valid claim — a worse failure than getting the absence
    # behavior wrong.
    - "hypertension"
  must_not_mention:
    # Common LLM hallucination defaults for sparse charts. A fabricated
    # "patient is on lisinopril for hypertension" with no record to
    # cite is exactly what this case is designed to catch.
    - "lisinopril"
    - "metformin"
    - "I cannot"
    - "as an AI"
  expect_tools_called:
    - get_problem_list
    - get_active_medications
    - get_recent_labs
    - get_allergies
    - get_recent_encounters
