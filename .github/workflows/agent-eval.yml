name: agent-eval

# Runs the AgentForge Python agent's verifier unit tests + PHI mask unit tests
# + eval suite (smoke + full tiers, fixture mode) on every PR + push to master
# touching agent code or eval cases. Mirrors what the local pre-commit hook
# at scripts/git-hooks/pre-commit runs, so behavior matches dev expectations.
#
# Cost: zero. USE_FIXTURE_LLM=true and USE_FIXTURE_DATA=true keep this off
# the Anthropic API and out of the live MariaDB. Nightly-tier cases that
# require real LLM / real DB are skipped automatically (live_llm_required /
# live_db_required flags in the YAML cases).
#
# What this catches:
#   - Verifier rule regressions (16 tests)
#   - PHI date-bucketing mask regressions (12 tests)
#   - Eval Golden Set regressions across smoke + full tier (~9 cases in CI;
#     17 nightly cases skipped per skip-flag policy)
#   - End-to-end smoke (/health + UC1 happy path + bad-HMAC refusal)
#
# What this does NOT catch (intentional, see EVAL_SUITE.md §6):
#   - Live-LLM behavior (covered by the manual nightly tier)
#   - Live-DB queries against Synthea-imported MariaDB (covered nightly)
#   - LLM-as-judge quality scoring (week-2+)

on:
  pull_request:
    branches: [master]
    paths:
      - 'agent/**'
      - 'scripts/git-hooks/pre-commit'
      - '.github/workflows/agent-eval.yml'
  push:
    branches:
      - master
      - 'agentforge/**'
    paths:
      - 'agent/**'
      - 'scripts/git-hooks/pre-commit'
      - '.github/workflows/agent-eval.yml'
  # Allow manual re-runs from the Actions tab.
  workflow_dispatch:

# Same SHA shouldn't run twice — cancel any in-flight run when a newer commit
# lands on the same ref.
concurrency:
  group: agent-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-eval:
    name: Verifier + mask unit tests + eval Golden Set (smoke + full)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'agent/requirements.txt'

      - name: Install agent dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt

      - name: Run verifier + mask unit tests
        env:
          # Both fixture flags ON — keeps the run deterministic + free.
          USE_FIXTURE_LLM: 'true'
          USE_FIXTURE_DATA: 'true'
          # HMAC secret needs *some* value for the eval runner to compute
          # signatures. The actual secret content doesn't matter in fixture
          # mode — verify_hmac runs against this same env value.
          OPENEMR_HMAC_SECRET: 'ci-fixture-mode-not-a-real-secret'
          # Audit-log DB user is intentionally empty — _audit_log.py no-ops
          # when credentials are not configured (graceful for local dev / CI).
          DB_AUDIT_USER: ''
          DB_AUDIT_PASSWORD: ''
        run: |
          python -m pytest agent/tests/unit/ -v --tb=short

      - name: Run eval Golden Set (smoke + full tier, fixture mode)
        env:
          USE_FIXTURE_LLM: 'true'
          USE_FIXTURE_DATA: 'true'
          OPENEMR_HMAC_SECRET: 'ci-fixture-mode-not-a-real-secret'
          DB_AUDIT_USER: ''
          DB_AUDIT_PASSWORD: ''
        run: |
          python -m pytest agent/tests/eval/ -v --tb=short

      # Failed runs leave the most recent run report in the artifact for
      # post-mortem — the runner writes per-run markdown to
      # agent/tests/eval/results/<timestamp>.md. Always upload (success or
      # failure) so the artifact is available either way.
      - name: Upload eval run report (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report-${{ github.run_id }}
          path: agent/tests/eval/results/*.md
          retention-days: 14
          # If no result file was written (e.g. earlier step failed before
          # the runner produced output), don't fail the workflow.
          if-no-files-found: ignore
