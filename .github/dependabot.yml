# Dependabot configuration for the AgentForge fork.
#
# This fork does NOT maintain the upstream OpenEMR dependency tree
# (composer / npm / docker for the EMR layer). The upstream config
# was replaced 2026-05-02 to keep Dependabot focused on the small
# surface area we actually own + maintain:
#
#   1. agent/requirements.txt — the Python agent service deps
#   2. .github/workflows/      — pinned action versions
#
# Original upstream config preserved in git history at
# https://github.com/openemr/openemr/blob/master/.github/dependabot.yml
# if anyone needs to restore it.

version: 2
updates:
  # AgentForge Python agent service deps (anthropic SDK, fastapi, pydantic, etc.)
  - package-ecosystem: pip
    directory: /agent
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
      - agent
    commit-message:
      prefix: chore(agent)
      include: scope
    ignore:
      # Don't auto-bump major versions — review SDK breaking changes by hand.
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  # GitHub Actions versions (security: action versions can be
  # hijacked or compromised; keeping them current matters)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
