services:
  mysql:
    restart: always
    image: mariadb:11.8.6@sha256:78a5047d3ba33975f183f183c2464cc7f1eab13ec8667e57cc9a5821d6da7577
    command: ['mariadbd', '--character-set-server=utf8mb4', '--ssl-ca=/etc/ssl/ca.pem', '--ssl_cert=/etc/ssl/server-cert.pem', '--ssl_key=/etc/ssl/server-key.pem']
    ports:
    - "${WT_MYSQL_PORT:-8320}:3306"
    volumes:
    - ../library/sql-ssl-certs-keys/easy/ca.pem:/etc/ssl/ca.pem:ro
    - ../library/sql-ssl-certs-keys/easy/server-cert.pem:/etc/ssl/server-cert.pem:ro
    - ../library/sql-ssl-certs-keys/easy/server-key.pem:/etc/ssl/server-key.pem:ro
    - databasevolume:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test:
      - CMD
      - /usr/local/bin/healthcheck.sh
      - --su-mysql
      - --connect
      - --innodb_initialized
      start_period: 1m
      start_interval: 10s
      interval: 1m
      timeout: 5s
      retries: 3
  openemr:
    restart: always
    image: openemr/openemr:flex@sha256:e4562b0c7d3f222ec8f72122ce00d10ffa93f559c38c00ab12c1355394c35d1c
    ports:
    - "${WT_HTTP_PORT:-8300}:80"
    - "${WT_HTTPS_PORT:-9300}:443"
    volumes:
    - ${OPENEMR_DIR:-../..}:/openemr:ro
    - ${OPENEMR_DIR:-../..}:/var/www/localhost/htdocs/openemr:rw
    - assetvolume:/var/www/localhost/htdocs/openemr/public/assets:rw
    - themevolume:/var/www/localhost/htdocs/openemr/public/themes:rw
    - sitesvolume:/var/www/localhost/htdocs/openemr/sites:rw
    - nodemodules:/var/www/localhost/htdocs/openemr/node_modules:rw
    - vendordir:/var/www/localhost/htdocs/openemr/vendor:rw
    - ccdanodemodules:/var/www/localhost/htdocs/openemr/ccdaservice/node_modules:rw
    - ccdanodemodules2:/var/www/localhost/htdocs/openemr/ccdaservice/packages/oe-cqm-service/node_modules:rw
    - logvolume:/var/log
    - couchdbvolume:/couchdb/data
    environment:
      DEBUG_COLORS: "true"
      TERM: xterm-256color
      COLORTERM: truecolor
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASS: root
      MYSQL_USER: openemr
      MYSQL_PASS: openemr
      OE_USER: admin
      OE_PASS: pass
      EASY_DEV_MODE: "yes"
      EASY_DEV_MODE_NEW: "yes"
      DEVELOPER_TOOLS: "yes"
      XDEBUG_ON: 1
      XDEBUG_PROFILER_ON: 1
      # setting xdebug client host for cases where xdebug.discover_client_host fails
      XDEBUG_CLIENT_HOST: host.docker.internal
      GITHUB_COMPOSER_TOKEN: c313de1ed5a00eb6ff9309559ec9ad01fcc553f0
      GITHUB_COMPOSER_TOKEN_ENCODED: Z2hwX0NpbnJ4aXlNd0NzcGZXWG1UWFUwcXhGa040elFKSDJoZGJXVw==
      GITHUB_COMPOSER_TOKEN_ENCODED_ALTERNATE: '103 104 112 95 57 54 108 115 88 116 87 72 51 75 81 105 69 88 88 119 97 79 80 78 109 69 66 115 85 97 106 78 112 71 49 81 90 102 74 121'
      SELENIUM_USE_GRID: "true"
      SELENIUM_HOST: selenium
      SELENIUM_FORCE_HEADLESS: "false"
      SELENIUM_BASE_URL: "http://openemr"
      OPENEMR_DOCKER_ENV_TAG: easy-dev-docker
      OPENEMR_SETTING_site_addr_oath: 'https://localhost:${WT_HTTPS_PORT:-9300}'
      OPENEMR_SETTING_oauth_password_grant: 3
      OPENEMR_SETTING_rest_system_scopes_api: 1
      OPENEMR_SETTING_rest_api: 1
      OPENEMR_SETTING_rest_fhir_api: 1
      OPENEMR_SETTING_rest_portal_api: 1
      OPENEMR_SETTING_portal_onsite_two_enable: 1
      OPENEMR_SETTING_ccda_alt_service_enable: 3
      OPENEMR_SETTING_couchdb_host: couchdb
      OPENEMR_SETTING_couchdb_port: 6984
      OPENEMR_SETTING_couchdb_user: admin
      OPENEMR_SETTING_couchdb_pass: password
      OPENEMR_SETTING_couchdb_dbase: example
      OPENEMR_SETTING_couchdb_ssl_allow_selfsigned: 1
      OPENEMR_SETTING_gbl_ldap_host: 'ldap://openldap:389'
      OPENEMR_SETTING_gbl_ldap_dn: 'cn={login},dc=example,dc=org'
      OPENEMR_SETTING_EMAIL_METHOD: SMTP
      OPENEMR_SETTING_SMTP_HOST: mailpit
      OPENEMR_SETTING_SMTP_PORT: 1025
      OPENEMR_SETTING_SMTP_USER: openemr
      OPENEMR_SETTING_SMTP_PASS: openemr
      OPENEMR_SETTING_SMTP_SECURE: ''
      OPENEMR_SETTING_SMTP_Auth: 'TRUE'
      OPENEMR_SETTING_practice_return_email_path: 'noreply@openemr.local'
      OPENEMR_SETTING_Patient_Reminder_Sender_Name: 'OpenEMR Reminders'
      # W2 Stage-4a: Clinical Co-Pilot agent service connection.
      # AgentClient.php reads AGENT_BASE_URL via getenv() at request time;
      # OPENEMR_HMAC_SECRET must match the agent container's same env var.
      AGENT_BASE_URL: http://agent:8000
      OPENEMR_HMAC_SECRET: dev-secret-not-for-production-only-local
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - /usr/bin/curl
      - --fail
      - --insecure
      - --location
      - --show-error
      - --silent
      - https://localhost/meta/health/readyz
      start_period: 3m
      start_interval: 10s
      interval: 1m
      timeout: 5s
      retries: 3
  selenium:
    restart: always
    image: selenium/standalone-chromium:147.0.7727.55@sha256:e80834f17556d310d92f114c38df84a4c09bfa9564d428c770ea122346c0932c
    ports:
    - "${WT_SELENIUM_PORT:-4444}:4444"
    - "${WT_VNC_PORT:-7900}:7900"
    environment:
      SE_VNC_PASSWORD: openemr123
      SE_SCREEN_WIDTH: 1920
      SE_SCREEN_HEIGHT: 1080
      SE_SCREEN_DEPTH: 24
      SE_START_XVFB: true
    volumes:
    - /dev/shm:/dev/shm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/wd/hub/status"]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
  phpmyadmin:
    restart: always
    image: phpmyadmin:latest@sha256:0480a7583f876944d10c112177309d1d7bd4f1bf76770c6e7cb04706d4e36375
    ports:
    - "${WT_PMA_PORT:-8310}:80"
    environment:
      PMA_HOSTS: mysql
    depends_on:
      mysql:
        condition: service_healthy
  couchdb:
    restart: always
    image: couchdb:3.5.1@sha256:0ff2633acd380777f2c65af22eabb1d961569e05e25b12c5239b00a7f8b56d54
    ports:
    - "${WT_COUCHDB_PORT:-5984}:5984"
    - "${WT_COUCHDB_SSL_PORT:-6984}:6984"
    volumes:
    - ../library/couchdb-config-ssl-cert-keys/local.ini:/opt/couchdb/etc/local.ini:rw
    - ../library/couchdb-config-ssl-cert-keys/easy/ca.pem:/etc/ssl/ca.pem:ro
    - ../library/couchdb-config-ssl-cert-keys/easy/server-cert.pem:/etc/ssl/server-cert.pem:ro
    - ../library/couchdb-config-ssl-cert-keys/easy/server-key.pem:/etc/ssl/server-key.pem:ro
    - couchdbvolume:/opt/couchdb/data
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password
  openldap:
    restart: always
    image: openemr/dev-ldap:easy@sha256:b1dbb4b1f1074b6a298dabd256b80d766bccbfca99aa89d023cf894d6f4c57aa
    environment:
      LDAP_TLS_VERIFY_CLIENT: try
      LDAP_TLS_CA_CRT_FILENAME: ca.pem
      LDAP_TLS_CRT_FILENAME: server-cert.pem
      LDAP_TLS_KEY_FILENAME: server-key.pem
  mailpit:
    restart: unless-stopped
    image: axllent/mailpit:v1.29.7@sha256:757f22b56c1da03570afdb3d259effe5091018008a81bbedc8158cee7e16fdbc
    ports:
    - "${WT_MAILPIT_UI_PORT:-8025}:8025"
    - "${WT_MAILPIT_SMTP_PORT:-1025}:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
    volumes:
    - mailpitvolume:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8025/api/v1/messages"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3
  # W2 Stage-4a: Clinical Co-Pilot Python agent service.
  # Internal-network only — OpenEMR talks to it at http://agent:8000.
  # W2_ARCHITECTURE.md §2.1 (two-actor workflow), §3 (multi-agent graph).
  # First build downloads Docling layout models (~80MB) into HF_HOME volume.
  agent:
    restart: always
    build:
      context: ../../agent
      dockerfile: Dockerfile
    environment:
      # Anthropic / LLM, Langfuse — intentionally NOT set here.
      # The agent's config.py calls load_dotenv() at import time, which reads
      # /app/agent/.env (bind-mounted from agent/.env on the host).  If we set
      # these as empty defaults via ${VAR:-}, docker-compose injects an empty
      # string into the container env, and load_dotenv (override=False by default)
      # then refuses to overwrite it — silently breaking Haiku / Langfuse.
      # Production deploy on the droplet sources these from /opt/agentforge/.env
      # via .deploy/bootstrap.sh, which writes them as real values, not empties.
      # HMAC must match the openemr service's OPENEMR_HMAC_SECRET above.
      # Sourced from host shell so we can sync it on the fly with whatever
      # openemr's running container already has set (avoids a 10-min openemr
      # cold-start retake just to align the secret).  Pull from the running
      # openemr container before bringing the agent up:
      #   export OPENEMR_HMAC_SECRET=$(docker compose exec -T openemr \
      #     printenv OPENEMR_HMAC_SECRET | tr -d '\r\n')
      #   docker compose up -d agent
      OPENEMR_HMAC_SECRET: ${OPENEMR_HMAC_SECRET:-}
      # MariaDB access for W1 patient-record tools (get_problem_list,
      # get_active_medications, etc.).  agent/config.py reads these
      # specific env-var names — `AGENT_DB_*`, not `MYSQL_*`.  In dev we
      # use the existing openemr user (full DB access); production
      # bootstrap.sh provisions a read-only `agent_ro` user.
      # AGENT_DB_PORT must be the IN-CONTAINER MySQL port (3306), not the
      # host-side mapped port (8320 in this compose).
      AGENT_DB_HOST: mysql
      AGENT_DB_PORT: 3306
      AGENT_DB_USER: openemr
      AGENT_DB_PASS: openemr
      AGENT_DB_NAME: openemr
      # Fall back to fixture data if the live DB call errors — keeps the
      # demo resilient when the dev stack hasn't been fully initialized.
      USE_FIXTURE_DATA: "false"
      # Qdrant (Stage-3a hybrid RAG vector path)
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      # HuggingFace model cache for sentence-transformers / Docling
      HF_HOME: /app/.hf_cache
      # Set true to mock LLM calls (saves API budget during dev)
      USE_FIXTURE_LLM: ${USE_FIXTURE_LLM:-false}
    ports:
    - "${AGENT_PORT:-8000}:8000"
    volumes:
    # Bind-mount source so code edits land without rebuild
    - ../../agent:/app/agent:rw
    # Persist Docling / HF model cache across restarts
    - hf_cache:/app/.hf_cache
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      start_period: 60s
      interval: 30s
      timeout: 5s
      retries: 3
  # W2 Stage-3a: Qdrant vector DB for hybrid RAG guideline retrieval.
  # W2_ARCHITECTURE.md §6.1 (Qdrant choice), §6.3 (retrieval pipeline).
  # After container starts, run: python -m agent.corpus.ingest
  qdrant:
    restart: unless-stopped
    image: qdrant/qdrant:v1.10.0
    ports:
    - "${QDRANT_PORT:-6333}:6333"
    - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
    - qdrantvolume:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:6333/healthz"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  databasevolume: {}
  assetvolume: {}
  themevolume: {}
  sitesvolume: {}
  nodemodules: {}
  vendordir: {}
  ccdanodemodules: {}
  ccdanodemodules2: {}
  logvolume: {}
  couchdbvolume: {}
  mailpitvolume: {}
  qdrantvolume: {}
  # W2 Stage-4a: HuggingFace / Docling model cache for the agent service.
  hf_cache: {}
